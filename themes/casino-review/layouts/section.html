{{ define "main" }}
<section class="hero hero-sm">
  <div class="container">
    <h1>{{ .Title }}</h1>
    <div class="hero-text">{{ .Content }}</div>
  </div>
</section>
<section class="section">
  <div class="container">
    <div class="casino-list">
      {{ range $i, $p := .Pages }}
        {{ with where hugo.Data.casinos "slug" $p.Params.casino }}
          {{ partial "casino-card.html" (dict "c" (index . 0) "rank" (add $i 1)) }}
        {{ else }}
          <a class="plain-card" href="{{ $p.RelPermalink }}"><h3>{{ $p.Title }}</h3><p class="muted">{{ $p.Description }}</p></a>
        {{ end }}
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
