- title: Licence and safety
  text: We check the gambling licence, SSL encryption and the casino's track record with players.
- title: Payout speed
  text: We request real withdrawals via bKash, Nagad and cards and time how long they take.
- title: Bonus terms
  text: We read the small print — wagering, max bet, game weighting and time limits.
- title: Games
  text: Slots, live dealer, Teen Patti, Andar Bahar and cricket-themed games from trusted providers.
- title: Mobile
  text: We play on Android and iOS, in the browser and in the app.
- title: Support
  text: We contact support by live chat and email and check if help is available in Bangla.
